name: Test dev container features

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test claude-code-rtk
        run: devcontainer features test -f claude-code-rtk -i mcr.microsoft.com/devcontainers/base:noble .

      - name: Test opencode-rtk
        run: devcontainer features test -f opencode-rtk -i mcr.microsoft.com/devcontainers/base:noble .
